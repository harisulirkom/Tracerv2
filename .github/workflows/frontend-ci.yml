name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect dependency audit
        run: npm audit --omit=dev --json > npm-audit.json
        continue-on-error: true

      - name: Enforce npm audit policy
        run: node scripts/security/check-npm-audit.mjs npm-audit.json scripts/security/npm-audit-policy.json

      - name: Run lightweight secret scan
        run: bash scripts/security/scan-secrets.sh "$GITHUB_WORKSPACE"

      - name: Build
        run: npm run build
